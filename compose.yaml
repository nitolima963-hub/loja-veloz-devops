
services:

  postgres:
    image: postgres:16
    container_name: loja-veloz-postgres
    environment:
      POSTGRES_DB: lojaveloz
      POSTGRES_USER: lojaveloz
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lojaveloz -d lojaveloz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loja-veloz-network

  pedidos:
    build:
      context: ./pedidos-service
    image: loja-veloz/pedidos:1.0.0
    container_name: loja-veloz-pedidos
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lojaveloz
      DB_USER: lojaveloz
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - loja-veloz-network

  estoque:
    build:
      context: ./estoque-service
    image: loja-veloz/estoque:1.0.0
    container_name: loja-veloz-estoque
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lojaveloz
      DB_USER: lojaveloz
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - loja-veloz-network

  pagamentos:
    build:
      context: ./pagamentos-service
    image: loja-veloz/pagamentos:1.0.0
    container_name: loja-veloz-pagamentos
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lojaveloz
      DB_USER: lojaveloz
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - loja-veloz-network

  gateway:
    build:
      context: ./api-gateway
    image: loja-veloz/api-gateway:1.0.0
    container_name: loja-veloz-gateway
    ports:
      - "8083:8083"
    environment:
      PEDIDOS_URL: http://pedidos:8080
      ESTOQUE_URL: http://estoque:8081
      PAGAMENTOS_URL: http://pagamentos:8082
    depends_on:
      - pedidos
      - estoque
      - pagamentos
    networks:
      - loja-veloz-network

volumes:
  postgres_data:

networks:
  loja-veloz-network:
    driver: bridge

