
spring.application.name=api-gateway

server.port=8083

# Rota para Pedidos
spring.cloud.gateway.server.webflux.routes[0].id=pedidos
spring.cloud.gateway.server.webflux.routes[0].uri=${PEDIDOS_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/pedidos/**

# Rota para Estoque
spring.cloud.gateway.server.webflux.routes[1].id=estoque
spring.cloud.gateway.server.webflux.routes[1].uri=${ESTOQUE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/produtos/**

# Rota para Pagamentos
spring.cloud.gateway.server.webflux.routes[2].id=pagamentos
spring.cloud.gateway.server.webflux.routes[2].uri=${PAGAMENTOS_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/pagamentos/**

# Monitoramento
management.endpoints.web.exposure.include=health,info
