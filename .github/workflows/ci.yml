
name: CI - Loja Veloz

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  testes:
    name: Testar ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - pedidos-service
          - estoque-service
          - pagamentos-service
          - api-gateway

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lojaveloz
          POSTGRES_USER: lojaveloz
          POSTGRES_PASSWORD: dev123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lojaveloz -d lojaveloz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: lojaveloz
      DB_PASSWORD: dev123

    steps:
      - name: Baixar o codigo do GitHub
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Dar permissao ao Maven Wrapper
        working-directory: ${{ matrix.service }}
        run: chmod +x mvnw

      - name: Compilar e executar testes
        working-directory: ${{ matrix.service }}
        run: ./mvnw clean verify

  publicar-imagens:
    name: Publicar ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: testes

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - pedidos-service
          - estoque-service
          - pagamentos-service
          - api-gateway

    steps:
      - name: Baixar o codigo do GitHub
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fazer login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar e publicar imagem Docker
        uses: docker/build-push-action@v6
        env:
          IMAGE_NAME: ghcr.io/nitolima963-hub/loja-veloz-devops/${{ matrix.service }}
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/nitolima963-hub/loja-veloz-devops/${{ matrix.service }}:latest
            ghcr.io/nitolima963-hub/loja-veloz-devops/${{ matrix.service }}:1.0.0
