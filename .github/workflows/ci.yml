name: CI - Loja Veloz

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build e Testes - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - pedidos-service
          - estoque-service
          - pagamentos-service

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lojaveloz
          POSTGRES_USER: lojaveloz
          POSTGRES_PASSWORD: dev123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lojaveloz -d lojaveloz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: lojaveloz
      DB_PASSWORD: dev123

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '${{ matrix.service }}/pom.xml'

      - name: Dar permissao ao Maven Wrapper
        working-directory: ${{ matrix.service }}
        run: chmod +x mvnw

      - name: Compilar e executar testes
        working-directory: ${{ matrix.service }}
        run: ./mvnw clean verify

  publish-images:
    name: Publicar imagem - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - pedidos-service
          - estoque-service
          - pagamentos-service

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar nome da imagem
        id: image
        shell: bash
        run: |
          SERVICE="${{ matrix.service }}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:1.0.0
