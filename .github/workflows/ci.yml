
name: CI - Loja Veloz

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build e Testes - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - pedidos-service
          - estoque-service
          - pagamentos-service

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lojaveloz
          POSTGRES_USER: lojaveloz
          POSTGRES_PASSWORD: dev123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lojaveloz -d lojaveloz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: lojaveloz
      DB_PASSWORD: dev123

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '${{ matrix.service }}/pom.xml'

      - name: Dar permissao ao Maven Wrapper
        working-directory: ${{ matrix.service }}
        run: chmod +x mvnw

      - name: Compilar e executar testes
        working-directory: ${{ matrix.service }}
        run: ./mvnw clean verify
